<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore o Mundo - Expedições</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <i class="fa-solid fa-earth-americas"></i>
            <span>Explore o Mundo</span>
        </div>
        <div class="navegacao">
            <nav class="menu-links">
                <a href="index.html">Início</a>
                <a href="destinos.html">Destinos</a>
                <a href="sobrenos.html">Sobre</a>
                <a href="contato.html">Contato</a>
            </nav>
            <div class="redes-sociais">
                <a href="" class="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="" class="facebook"><i class="fa-brands fa-facebook"></i></i></a>
                <a href="" class="instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="" class="x"><i class="fa-brands fa-x-twitter"></i></a>
            </div>

        </div>

    </header>

    <main class="container">
        <h1 class="titulo-secao">Cadastre-Se na Explore o Mundo</h1>
        <p class="subtitulo">Preencha seus dados e tire suas dúvidas de imediato!</p>

        <div class="area-inscricao">

            <form action="/processar-cadastro" method="post" class="coluna-form">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite Seu Nome" required minlength="3" maxlength="50"><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br>

                <label for="mensagem">Sua mensagem:</label>
                <input type="text" id="mensagem" placeholder="Digite Sua Mensagem" required minlength="50" maxlength="300"><br>

                <label for="assunto">Assunto</label><br>
                <select name="assunto" id="assunto" required>
                    <option value="" disa selected>Selecione o Assunto</option>
                    <option value="duvida">Dúvidas sobre destinos</option>
                    <option value="sugestoes">Sugestões</option>
                    <option value="parcerias">Parcerias</option>
                    <option value="problemas">Problemas no site</option>
                    <option value="outro">Outro(Escreva)</option>


                </select><br><br>
                <input type="checkbox" id="termos" name="termos" required>  
                <label for="termos">Li e Aceito os Termos</label><br><br>

                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-limpar">Limpar Tudo</button>
                

            </form>
        </div>

    </main>

    <footer class="rodape">
        <p>© 2026 Explore o Mundo - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
