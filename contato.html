    <main class="container">
        <h1 class="titulo-secao">Cadastro Para Dicas de Filmes</h1>
        <p class="subtitulo">Preencha seus dados para realizar a inscrição no CineSENAI</p>

        <div class="area-inscricao">

            <form action="/processar-cadastro" method="post" class="coluna-form">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite Seu Nome" required minlength="3" maxlength="50"><br>

                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite Sua Senha" required minlength="8" maxlength="15"><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br>

                <label for="data_nasc">Data de Nascimento:</label>
                <input type="date" id="data_nasc" name="data_nascimento" min="1900-01-01" max="2026-12-31" required><br><br>

                <label>Período dos Filmes</label><br>
                <input type="radio" id="turno_manha" name="turno" value="manha" required>
                <label for="turno_manha">Manhã</label>

                <input type="radio" id="turno_tarde" name="turno" value="tarde">
                <label for="turno_tarde">Tarde</label>

                <input type="radio" id="turno_noite" name="turno" value="noite">
                <label for="turno_noite">Noite</label><br><br>

                <label>Filmes de Interesse</label><br>
                <input type="checkbox" id="acao" name="interesse" value="acao">
                <label for="acao">Filme de Ação</label><br>

                <input type="checkbox" id="comedia" name="interesse" value="comedia">
                <label for="comedia">Filme de Comédia</label><br>

                <input type="checkbox" id="terror" name="interesse" value="terror">
                <label for="terror">Filme de Terror</label><br><br>

                <label for="unidade">Selecione o Cinema</label><br>
                <select name="unidade" id="unidade" required>
                    <option value="" disa selected>Selecione um Cinema</option>
                    <option value="sp">São Paulo - Capital</option>
                    <option value="sebastianopolis">Sebastianópolis do Sul</option>
                    <option value="votuporanga">Votuporanga</option>
                    <option value="valentim">Valentim Gentil</option>


                </select><br><br>
                <input type="checkbox" id="termos" name="termos" required>  
                <label for="termos">Li e Aceito os Termos</label><br><br>

                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-limpar">Limpar Tudo</button>
                

            </form>

            <div class="coluna-midia"> 
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1569.6736995210983!2d-49.92197540365232!3d-20.655975606285935!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94bd7b4b248f03a1%3A0xb8ed21a313f879da!2sSebastianopolis%20do%20Sul!5e0!3m2!1spt-BR!2sbr!4v1787665705507!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            </div>

        </div>
